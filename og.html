<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0fa;--ink:#0e1a3a;--blue:#1f56b5; --red:#e3262e;--paper:#ffffff;--holo:linear-gradient(115deg,#ff8fb1 0%,#ffd76e 22%,#8dffb8 45%,#78d6ff 68%,#b9a0ff 88%,#ff8fb1 100%)}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--bg);color:var(--ink);position:relative;font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
.k{position:absolute;left:72px;top:52px;font:600 22px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#4a5878}
h1{position:absolute;left:72px;top:112px;margin:0;width:660px;font-weight:900;text-transform:uppercase;font-size:100px;line-height:.92}
.st{position:absolute;left:72px;bottom:52px;background:var(--red);color:#fff;padding:8px 16px;font:600 30px 'IBM Plex Mono',monospace}
.card{position:absolute;left:800px;top:70px;width:300px;height:420px;transform:rotate(7deg);background:var(--holo);border-radius:20px;padding:11px;box-shadow:0 18px 30px -14px rgba(14,26,58,.5)}
.face{height:100%;background:var(--paper);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px}
.band{display:flex;justify-content:space-between;font:600 14px 'IBM Plex Mono',monospace;letter-spacing:.1em}
.art{flex:1;border:3px solid var(--ink);border-radius:7px;background:var(--blue);position:relative;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.ft{display:flex;justify-content:space-between;font:600 15px 'IBM Plex Mono',monospace}
.ball{position:absolute;left:950px;top:400px;width:170px;height:170px;transform:rotate(-10deg);filter:drop-shadow(0 10px 12px rgba(14,26,58,.3))}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><clipPath id="cl"><circle cx="32" cy="32" r="29"/></clipPath>
<pattern id="pd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="3" fill="#0e1a3a" opacity=".2"/></pattern>
<symbol id="b" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#ffffff"/><g clip-path="url(#cl)"><g transform="rotate(-22 32 32)"><rect x="-20" y="-20" width="104" height="52" fill="#e3262e"/><rect x="-20" y="28" width="104" height="8" fill="#0e1a3a"/></g></g><path d="M14 22a21 21 0 0 1 12-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8"/><circle cx="32" cy="32" r="29" fill="none" stroke="#0e1a3a" stroke-width="3.5"/><circle cx="32" cy="32" r="8.5" fill="#ffffff" stroke="#0e1a3a" stroke-width="3.5"/><circle cx="32" cy="32" r="3" fill="#0e1a3a"/></symbol></defs></svg>
<p class="k">Tokyo &middot; One day</p>
<h1>A day of Pok&eacute;mon cards and Nintendo</h1>
<div class="st">3 plans, 1 day</div>
<div class="card"><div class="face"><div class="band"><span>PLAN B</span><span>&#9679;</span></div>
<div class="art"><svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMid slice"><rect width="200" height="240" fill="#ffffff"/><rect width="200" height="240" fill="url(#pd)"/><circle cx="100" cy="120" r="78" fill="#1f56b5"/><circle cx="100" cy="120" r="92" fill="none" stroke="#0e1a3a" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/></svg></div>
<div class="ft"><span>B/03</span><span>&#9679;</span></div></div></div>
<svg class="ball"><use href="#b"/></svg>
</body></html>
